name: SoftMobile Groq Pilot (offline)

on:
  pull_request:
    paths:
      - 'integrations/softmobile/ai/**'
      - '.github/workflows/softmobile-groq-pilot.yml'
  push:
    paths:
      - 'integrations/softmobile/ai/**'
      - '.github/workflows/softmobile-groq-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/softmobile/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q groq_pilot.py test_groq_pilot.py configurar_clave_groq.py test_configurar_clave_groq.py chatwoot_ai_bridge.py test_chatwoot_ai_bridge.py quality_auditor.py test_quality_auditor.py auto_improver.py test_auto_improver.py pilot_transport_monitor.py test_pilot_transport_monitor.py
      - name: Unit tests (without any keys or network)
        run: python -m unittest -v test_groq_pilot test_configurar_clave_groq test_chatwoot_ai_bridge test_quality_auditor test_auto_improver test_pilot_transport_monitor
