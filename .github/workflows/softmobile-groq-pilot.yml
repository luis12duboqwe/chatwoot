name: SoftMobile Groq Pilot (offline)

on:
  pull_request:
    paths:
      - 'integrations/softmobile/ai/**'
      - '.github/workflows/softmobile-groq-pilot.yml'
  push:
    paths:
      - 'integrations/softmobile/ai/**'
      - '.github/workflows/softmobile-groq-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/softmobile/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m compileall -q groq_pilot.py test_groq_pilot.py configurar_clave_groq.py test_configurar_clave_groq.py chatwoot_ai_bridge.py test_chatwoot_ai_bridge.py sales_context.py suggestion_guard.py test_sales_context.py variant_preference.py test_variant_preference.py groq_sales_shadow.py test_groq_sales_shadow.py journey_memory.py groq_sales_journeys.py test_groq_sales_journeys.py groq_sales_objections.py test_groq_sales_objections.py sales_quality_gate.py test_sales_quality_gate.py lead_handoff.py test_lead_handoff.py quality_auditor.py test_quality_auditor.py auto_improver.py test_auto_improver.py pilot_transport_monitor.py test_pilot_transport_monitor.py synthetic_lab.py test_synthetic_lab.py interactive_lab.py test_interactive_lab.py repair_lab.py test_repair_lab.py patch_proposer.py test_patch_proposer.py review_fallback.py review_fallback_v2.py sandbox_review.py isolated_gate.py test_sandbox_review.py sandbox_stress.py test_sandbox_stress.py family_gate.py test_family_gate.py proposal_iteration.py test_proposal_iteration.py test_post_sale_multitopic.py groq_usage_policy.py test_groq_usage_policy.py autonomous_learning.py test_autonomous_learning.py learned_retest.py test_learned_retest.py
      - name: Unit tests (without any keys or network)
        run: python -m unittest -v test_groq_pilot test_configurar_clave_groq test_chatwoot_ai_bridge test_sales_context test_variant_preference test_groq_sales_shadow test_groq_sales_journeys test_groq_sales_objections test_sales_quality_gate test_lead_handoff test_quality_auditor test_auto_improver test_pilot_transport_monitor test_synthetic_lab test_interactive_lab test_repair_lab test_patch_proposer test_sandbox_review test_sandbox_stress test_family_gate test_proposal_iteration test_post_sale_multitopic test_groq_usage_policy test_autonomous_learning test_learned_retest
